<style>
/* Layout: eine Spalte wie ein Spielbericht. Admin hat oben eine Tab-Leiste, Ergebnisse sind Anzeigetafel-Karten mit Rückennummer-Marken. */
:root{
  --bg:#f2f5ee; --surface:#ffffff; --surface2:#e7eee2; --fg:#13201a; --muted:#566a5d; --line:#d1dbca;
  --accent:#1d6b43; --accent-fg:#ffffff; --gold:#f2c230; --gold-fg:#2a2000; --danger:#b3341f; --pitchA:#1d6b43; --pitchB:#1a6340; --hero-fg:#ffffff;
  --display:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
  --body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0d1511; --surface:#15211a; --surface2:#1d2c23; --fg:#e8efe5; --muted:#9bb0a2; --line:#2a3b31;
    --accent:#58c488; --accent-fg:#06180e; --gold:#f0c43c; --gold-fg:#241c00; --danger:#ff8a73; --pitchA:#14503a; --pitchB:#124833; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0d1511; --surface:#15211a; --surface2:#1d2c23; --fg:#e8efe5; --muted:#9bb0a2; --line:#2a3b31;
  --accent:#58c488; --accent-fg:#06180e; --gold:#f0c43c; --gold-fg:#241c00; --danger:#ff8a73; --pitchA:#14503a; --pitchB:#124833; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5;
  padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:.02em;margin:0;text-wrap:balance;line-height:1.1}
h1{font-size:2.2rem;text-transform:uppercase}
h2{font-size:1.5rem;text-transform:uppercase;margin-top:8px}
h3{font-size:1.25rem}
p{margin:0}
.muted{color:var(--muted)}
.brand{display:flex;flex-direction:column;gap:2px}
.brand small{color:var(--muted);font-size:.85rem}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;border-bottom:1px solid var(--line)}
.tab{font:600 .9rem var(--body);background:none;border:0;color:var(--muted);padding:10px 14px;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
.tab[aria-current="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.card header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.card header .sub{color:var(--muted);font-size:.88rem}
.pill{font:600 .72rem var(--body);letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;border-radius:99px;background:var(--surface2);color:var(--muted)}
.pill.open{background:var(--accent);color:var(--accent-fg)}
.btn{font:600 .92rem var(--body);min-height:44px;padding:0 18px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.primary:hover{filter:brightness(1.08)}

.btn.danger{color:var(--danger);border-color:var(--danger);background:transparent}

.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}

:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.nr{display:inline-flex;align-items:center;justify-content:center;min-width:2.2rem;height:2.2rem;padding:0 6px;border-radius:6px;background:var(--surface2);font:700 1.2rem var(--display);flex:none}
.winner{background:var(--gold);color:var(--gold-fg);border-radius:10px;padding:14px 16px;display:flex;align-items:center;gap:14px}
.winner .nr{background:var(--gold-fg);color:var(--gold);height:3rem;min-width:3rem;font-size:1.7rem}
.winner small{display:block;font:600 .72rem var(--body);letter-spacing:.08em;text-transform:uppercase}
.winner strong{font:700 1.8rem/1.1 var(--display);text-transform:uppercase;overflow-wrap:anywhere}
.winner .votes{margin-left:auto;text-align:right;font:700 1.5rem var(--display);white-space:nowrap}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:10px;align-items:center}

.track i{display:block;height:100%;background:var(--accent);border-radius:4px}
.bar.top .track i{background:var(--gold)}
.bar .cnt{font:700 1.2rem var(--display);font-variant-numeric:tabular-nums;white-space:nowrap}

.empty{border:2px dashed var(--line);border-radius:10px;padding:28px 18px;text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center}

.list{display:flex;flex-direction:column}

.chips{display:flex;gap:8px;flex-wrap:wrap}

.qrinfo{flex:1 1 220px;display:flex;flex-direction:column;gap:12px;min-width:0}
code{font:500 .85rem ui-monospace,Menlo,monospace;background:var(--surface2);padding:2px 6px;border-radius:4px;overflow-wrap:anywhere;word-break:break-all}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:99px;font-weight:500;font-size:.92rem;z-index:20;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:no-preference){.track i{transition:width .4s ease}}

.hero{position:relative;overflow:hidden;display:flex;align-items:center;gap:16px;padding:18px 20px;border-radius:12px;color:var(--hero-fg);
  background:repeating-linear-gradient(90deg,var(--pitchA) 0 44px,var(--pitchB) 44px 88px)}

.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}
label.btn{display:inline-flex;align-items:center;cursor:pointer}
label.btn:focus-within{outline:3px solid var(--accent);outline-offset:2px}
.winner{box-shadow:0 0 0 3px color-mix(in srgb,var(--gold) 35%,transparent)}
@media (max-width:420px){.hero{padding:16px}.hero h1{font-size:2rem}.crest{width:52px;height:60px}}
textarea{font:400 .95rem var(--body);min-height:130px;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg);width:100%;resize:vertical}

.pick-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(122px,1fr));gap:10px}
.pl{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding:12px 8px 10px;border-radius:14px;border:2px solid var(--line);background:var(--bg);color:var(--fg);font:500 .92rem/1.2 var(--body);cursor:pointer;min-width:0}
.pl:hover:not(:disabled){border-color:var(--accent)}
.pl:disabled{opacity:.6;cursor:not-allowed}
.pl[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,var(--bg))}
.pl .pn{overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pl .tag{position:absolute;top:8px;left:8px;min-width:1.7rem;height:1.7rem;font-size:1rem;background:var(--surface);border:1px solid var(--line)}
.pl .chk{position:absolute;top:8px;right:8px;width:1.6rem;height:1.6rem;border-radius:50%;background:var(--accent);color:var(--accent-fg);display:none;align-items:center;justify-content:center;font-weight:700;font-size:.9rem}
.pl[aria-pressed="true"] .chk{display:flex}
.av{display:block;object-fit:cover;border-radius:14px;flex:none;background:var(--surface2)}
.av.ini{display:inline-flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:700;color:var(--muted)}
.av.wav{border-radius:50%;border:3px solid var(--gold-fg)}
.bar .av{border-radius:50%}
.list>div{flex-wrap:wrap}
.colors{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.colorrow{display:flex;align-items:center;gap:12px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;min-width:0}
input[type=color]{width:48px;height:44px;padding:2px;border:1px solid var(--line);border-radius:8px;background:var(--bg);cursor:pointer;flex:none}
@media (prefers-reduced-motion:no-preference){
  .pl{transition:transform .18s ease,border-color .18s ease}

  .pl[aria-pressed="true"] .av{transform:scale(1.08)}
  .pl[aria-pressed="true"]{animation:ring 1.8s ease-out infinite}
  .enter .pl{animation:plIn .55s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--i) * 60ms)}
  .pl.pop{animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
  .winner.reveal{animation:winIn .7s cubic-bezier(.2,.9,.3,1.2) backwards}
  .winner.reveal .av{animation:spinIn .9s cubic-bezier(.2,.9,.3,1.1) backwards .15s}
  @keyframes plIn{from{opacity:0;transform:translateY(16px) scale(.86)}to{opacity:1;transform:none}}
  @keyframes pop{0%{transform:scale(.93)}55%{transform:scale(1.08)}100%{transform:scale(1)}}
  @keyframes ring{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 45%,transparent)}100%{box-shadow:0 0 0 12px color-mix(in srgb,var(--accent) 0%,transparent)}}
  @keyframes winIn{from{opacity:0;transform:scale(.9) translateY(10px)}to{opacity:1;transform:none}}
  @keyframes spinIn{from{opacity:0;transform:rotate(-200deg) scale(.2)}to{opacity:1;transform:none}}
}

/* Kopfbereich */
.hero{padding:22px 22px;gap:20px}
.crestplate{flex:none;width:116px;height:116px;border-radius:50%;background:#ffffff;border:4px solid var(--gold);box-shadow:0 8px 22px rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center}

.tagline{display:inline-block;background:var(--gold);color:var(--gold-fg);font:700 .8rem var(--body);letter-spacing:.1em;text-transform:uppercase;padding:5px 14px;border-radius:99px}

/* Abstimmung */
.pick-grid.has-sel .pl:not([aria-pressed="true"]){opacity:.68}
.pl[aria-pressed="true"]{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 20%,var(--bg));box-shadow:0 10px 24px rgba(0,0,0,.22);transform:scale(1.05);z-index:1}

.ballot{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:14px;border-radius:12px;background:color-mix(in srgb,var(--gold) 16%,var(--surface));border:2px solid var(--gold);margin-top:6px}

.ballot small{display:block;font:600 .72rem var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.ballot strong{display:block;font:700 1.7rem/1.1 var(--display);text-transform:uppercase;overflow-wrap:anywhere}

/* Sieger */
.winner{position:relative;overflow:hidden;flex-wrap:wrap;padding:22px 20px;gap:18px;background:linear-gradient(135deg,var(--gold),color-mix(in srgb,var(--gold) 68%,#fff));box-shadow:0 12px 30px rgba(0,0,0,.25)}

@media (prefers-reduced-motion:no-preference){
  .pl[aria-pressed="true"]{animation:ring2 1.8s ease-out infinite}
  .enter .pl{animation:plIn .55s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--i) * 60ms)}
  .pl.pop[aria-pressed="true"]{animation:pop .45s cubic-bezier(.3,1.6,.5,1),ring2 1.8s .45s ease-out infinite}
  .ballot.fresh{animation:slideUp .45s cubic-bezier(.2,.9,.3,1.2)}

  .winner.reveal::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.6) 50%,transparent 70%);transform:translateX(-110%);animation:shine 1.5s .6s ease-out forwards;pointer-events:none}
  .winner.reveal .crown{animation:crownIn .7s .5s cubic-bezier(.3,1.6,.5,1) backwards}
  .bars.reveal .track i{transform-origin:left;animation:grow .9s cubic-bezier(.2,.8,.2,1) backwards .35s}
  @keyframes ring2{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--gold) 60%,transparent),0 10px 24px rgba(0,0,0,.22)}100%{box-shadow:0 0 0 14px color-mix(in srgb,var(--gold) 0%,transparent),0 10px 24px rgba(0,0,0,.22)}}
  @keyframes slideUp{from{opacity:0;transform:translateY(14px) scale(.96)}to{opacity:1;transform:none}}

}

.member{border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px;min-width:0}

<script>
(function(){
var app=document.getElementById('app'), toastEl=document.getElementById('toast');
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}

function today(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function fmtDate(v){if(!v)return '';var d=new Date(v+'T12:00:00');return isNaN(d)?v:d.toLocaleDateString('de-DE',{weekday:'short',day:'2-digit',month:'2-digit',year:'numeric'})}

var cfg={club:{name:'',crest:''},theme:{},settings:{paused:false,hideResults:false},teams:[],matchdays:[]}, votes={};

function clubById(id){return reg.clubs.filter(function(c){return c.id===id})[0]}

function canAdmin(){return !!curClub&&(isSuper||(isAdmin&&(reg.access[uid]||[]).indexOf(curClub)>-1))}

/* ---------- Daten-Helfer ---------- */
function normalize(d){
  var c=JSON.parse(JSON.stringify(d||{}));
  c.club=(c.club&&typeof c.club==='object')?c.club:{};c.club.name=c.club.name||'';c.club.crest=c.club.crest||'';c.theme=(c.theme&&typeof c.theme==='object')?c.theme:{};THEME_KEYS.forEach(function(k){if(!HEXRE.test(c.theme[k]||''))c.theme[k]=''});c.settings=(c.settings&&typeof c.settings==='object')?c.settings:{};c.settings.paused=!!c.settings.paused;c.settings.hideResults=!!c.settings.hideResults;c.teams=Array.isArray(c.teams)?c.teams:[]; c.matchdays=Array.isArray(c.matchdays)?c.matchdays:[];
  c.teams.forEach(function(t){t.players=Array.isArray(t.players)?t.players:[]});
  c.matchdays.forEach(function(m){m.roster=Array.isArray(m.roster)?m.roster:[]});
  return c;
}
function sortedMd(list){return list.slice().sort(function(a,b){return String(b.date||'').localeCompare(String(a.date||''))||(b.created||0)-(a.created||0)})}
function mdTitle(m){return m.teamName+(m.opponent?' – '+m.opponent:'')}
function liveTally(m){
  var ids={};m.roster.forEach(function(p){ids[p.id]=1});var c={};
  Object.keys(votes).forEach(function(u){if(isBlocked(u))return;var p=votes[u]&&votes[u].picks&&votes[u].picks[m.id];if(p&&ids[p])c[p]=(c[p]||0)+1});
  return c;
}
function counts(m){return (m.status==='closed'&&m.result&&m.result.counts)?m.result.counts:liveTally(m)}
function total(c){var s=0;for(var k in c)s+=c[k];return s}
function isBlocked(u){var f=flags[u]&&flags[u].c&&flags[u].c[curClub];return !!(f&&f.blocked)}
function canVote(){return !!uid&&!!curClub&&!cfg.settings.paused&&canWrite!==false&&!isBlocked(uid)}
function myPicks(){return (uid&&votes[uid]&&votes[uid].picks)||{}}
function rosterSort(a,b){var x=parseInt(a.nr,10),y=parseInt(b.nr,10);if(isNaN(x))x=9999;if(isNaN(y))y=9999;return x-y||String(a.name).localeCompare(b.name,'de')}

function ini(name){var w=String(name||'').trim().split(/\s+/);return ((w[0]||'?')[0]+(w.length>1?w[w.length-1][0]:'')).toUpperCase()}
function avatar(p,size,cls){
  var st='width:'+size+'px;height:'+size+'px',ph=photos[p.id];
  if(ph)return '<img class="av '+(cls||'')+'" style="'+st+'" src="'+esc(ph)+'" alt="">';
  return '<span class="av ini '+(cls||'')+'" style="'+st+';font-size:'+Math.round(size*.4)+'px" aria-hidden="true">'+esc(ini(p.name))+'</span>';
}
/* ---------- Farben ---------- */
function rgb(h){return [1,3,5].map(function(i){return parseInt(h.substr(i,2),16)})}
function toHex(a){return '#'+a.map(function(v){var x=Math.max(0,Math.min(255,Math.round(v))).toString(16);return x.length<2?'0'+x:x}).join('')}
function lum(h){var c=rgb(h).map(function(v){v/=255;return v<=0.03928?v/12.92:Math.pow((v+0.055)/1.055,2.4)});return 0.2126*c[0]+0.7152*c[1]+0.0722*c[2]}
function onColor(h){return lum(h)>0.36?'#111111':'#ffffff'}
function darken(h,k){return toHex(rgb(h).map(function(v){return v*k}))}
function applyTheme(){
  var r=document.documentElement.style,t=cfg.theme||{};
  ['--accent','--accent-fg','--pitchA','--pitchB','--hero-fg','--gold','--gold-fg','--bg','--surface','--surface2','--fg','--muted','--line'].forEach(function(n){r.removeProperty(n)});
  if(HEXRE.test(t.accent||'')){var pa=darken(t.accent,0.8);r.setProperty('--accent',t.accent);r.setProperty('--accent-fg',onColor(t.accent));r.setProperty('--pitchA',pa);r.setProperty('--pitchB',darken(t.accent,0.68));r.setProperty('--hero-fg',onColor(pa))}
  if(HEXRE.test(t.gold||'')){r.setProperty('--gold',t.gold);r.setProperty('--gold-fg',onColor(t.gold))}
  var any=false;
  [['bg','--bg'],['surface','--surface'],['fg','--fg']].forEach(function(x){if(HEXRE.test(t[x[0]]||'')){r.setProperty(x[1],t[x[0]]);any=true}});
  if(any){r.setProperty('--surface2','color-mix(in srgb,var(--fg) 8%,var(--surface))');r.setProperty('--muted','color-mix(in srgb,var(--fg) 62%,var(--bg))');r.setProperty('--line','color-mix(in srgb,var(--fg) 16%,var(--bg))')}
}
function effColor(k){
  var v=cfg.theme&&cfg.theme[k];if(HEXRE.test(v||''))return v.toLowerCase();
  var tok={accent:'--accent',gold:'--gold',bg:'--bg',surface:'--surface',fg:'--fg'}[k];
  var c=getComputedStyle(document.documentElement).getPropertyValue(tok).trim();
  return HEXRE.test(c)?c.toLowerCase():'#000000';
}
var PRESETS=[{n:'Standard',a:'',g:''},{n:'Blau',a:'#2f6fd6',g:'#f2c230'},{n:'Rot',a:'#d1343f',g:'#f5c542'},{n:'Orange',a:'#e0661a',g:'#ffd166'},{n:'Violett',a:'#7a4fd0',g:'#f2c230'}];
var COLS=[['accent','Hauptfarbe','Kopfbereich, Buttons, Auswahl und Balken'],['gold','Siegerfarbe','Spieler des Spiels'],['bg','Seitenhintergrund',''],['surface','Kartenhintergrund',''],['fg','Textfarbe','']];

function burst(){
  try{if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)return}catch(e){}
  var cs=getComputedStyle(document.documentElement);
  var cols=[cs.getPropertyValue('--gold').trim()||'#f2c230',cs.getPropertyValue('--accent').trim()||'#1d6b43','#ffffff','#ff6b6b','#4dabf7','#ffd43b'];
  var host=document.createElement('div');host.className='confetti';
  for(var i=0;i<44;i++){
    var el=document.createElement('i');
    el.style.background=cols[i%cols.length];
    el.style.setProperty('--dx',(Math.random()*440-220).toFixed(0)+'px');
    el.style.setProperty('--dy',(-(Math.random()*220+80)).toFixed(0)+'px');
    el.style.setProperty('--rot',(Math.random()*720-360).toFixed(0)+'deg');
    el.style.animationDelay=(Math.random()*0.25).toFixed(2)+'s';
    host.appendChild(el);
  }
  document.body.appendChild(host);
  setTimeout(function(){if(host.parentNode)host.parentNode.removeChild(host)},2600);
}
function nrBadge(p){return '<span class="nr">'+(p.nr!==''&&p.nr!=null?esc(p.nr):'–')+'</span>'}

/* ---------- Speichern ---------- */
var chain=Promise.resolve();
function save(){
  var ref=cfgRef;if(!ref)return Promise.resolve();
  var body=JSON.parse(JSON.stringify(cfg));
  chain=chain.then(function(){return ref.set(body)}).catch(function(e){toast('Speichern fehlgeschlagen: '+((e&&(e.message||e.code))||'Fehler'))});
  render();return chain;
}

/* ---------- Ergebnis-Darstellung ---------- */
function resultHTML(m){
  var c=counts(m),tot=total(c);
  if(!tot)return '<p class="muted">Keine Stimmen abgegeben.</p>';
  var rows=m.roster.map(function(p){return {p:p,n:c[p.id]||0}}).sort(function(a,b){return b.n-a.n||rosterSort(a.p,b.p)});
  var max=rows[0].n,win=rows.filter(function(r){return r.n===max});
  var rv='';if(!seen['w'+m.id]){rv=' reveal';toMark.push('w'+m.id);wantConfetti=true}
  var h='';
  if(win.length===1){
    h+='<div class="winner'+rv+'">'+'<div class="winav"><svg class="crown" viewBox="0 0 24 16" aria-hidden="true"><path d="M2 15 1 4l6 5 5-8 5 8 6-5-1 11z" fill="currentColor"/></svg>'+avatar(win[0].p,96,'wav')+'</div>'+'<div><small>★ Spieler des Spiels'+(win[0].p.nr!==''&&win[0].p.nr!=null?' · #'+esc(win[0].p.nr):'')+'</small><strong>'+esc(win[0].p.name)+'</strong></div><div class="votes">'+max+' <small style="display:inline;font-size:.8rem">von '+tot+'</small></div></div>';
  }else{
    h+='<div class="winner'+rv+'"><div><small>Gleichstand mit je '+max+' Stimmen</small><strong>'+win.map(function(r){return esc(r.p.name)}).join(' · ')+'</strong></div><div class="votes">'+tot+' <small style="display:inline;font-size:.8rem">Stimmen</small></div></div>';
  }
  h+='<div class="bars'+rv+'">';
  rows.filter(function(r){return r.n>0}).forEach(function(r){
    h+='<div class="bar'+(r.n===max?' top':'')+'">'+avatar(r.p,40)+'<div class="who"><b>'+esc(r.p.name)+'</b><div class="track"><i style="width:'+pct(r.n,max)+'%"></i></div></div><div class="cnt">'+r.n+' <small>'+pct(r.n,tot)+'%</small></div></div>';
  });
  h+='</div>';
  var zero=rows.filter(function(r){return r.n===0}).length;
  if(zero)h+='<p class="muted" style="font-size:.85rem">'+zero+' Spieler ohne Stimme.</p>';
  return h;
}
function resultCard(m,live){
  return '<section class="card"><header><div><h3>'+esc(mdTitle(m))+'</h3><div class="sub">'+esc(fmtDate(m.date))+'</div></div><span class="pill'+(m.status==='open'?' open':'')+'">'+(m.status==='open'?'Läuft':'Beendet')+'</span></header>'+(live?'<p class="muted" style="font-size:.85rem">Zwischenstand, nur für dich sichtbar.</p>':'')+resultHTML(m)+'</section>';
}
function seasonHTML(){
  var closed=cfg.matchdays.filter(function(m){return m.status==='closed'&&total(counts(m))>0});
  if(!closed.length)return '';
  var teams={};
  closed.forEach(function(m){
    var t=teams[m.teamId]||(teams[m.teamId]={name:m.teamName,games:0,pl:{}});t.games++;t.name=m.teamName;
    var c=counts(m),max=0;for(var k in c)if(c[k]>max)max=c[k];
    m.roster.forEach(function(p){
      var e=t.pl[p.id]||(t.pl[p.id]={p:p,wins:0,votes:0});e.p=p;e.votes+=c[p.id]||0;if(max&&c[p.id]===max)e.wins++;
    });
  });
  var h='<h2>Saison</h2>';
  Object.keys(teams).forEach(function(id){
    var t=teams[id];
    var rows=Object.keys(t.pl).map(function(k){return t.pl[k]}).filter(function(e){return e.votes>0}).sort(function(a,b){return b.wins-a.wins||b.votes-a.votes||rosterSort(a.p,b.p)});
    h+='<section class="card"><header><h3>'+esc(t.name)+'</h3><span class="pill">'+t.games+' Spieltag'+(t.games===1?'':'e')+'</span></header><div class="scroll"><table class="table"><thead><tr><th>#</th><th>Spieler</th><th class="n">Spieler des Spiels</th><th class="n">Stimmen</th></tr></thead><tbody>';
    rows.forEach(function(e){h+='<tr><td>'+nrBadge(e.p)+'</td><td>'+esc(e.p.name)+'</td><td class="n"><b>'+e.wins+'</b></td><td class="n">'+e.votes+'</td></tr>'});
    h+='</tbody></table></div></section>';
  });
  return h;
}

/* ---------- Ansicht: Abstimmung ---------- */
function voteCard(m){
  var mine=myPicks()[m.id],sel=pending[m.id]!==undefined?pending[m.id]:mine;
  var enter='';if(!seen['v'+m.id]){enter=' enter';toMark.push('v'+m.id)}
  var changed=!!sel&&sel!==mine;
  var h='<section class="card"><header><div><h3>'+esc(mdTitle(m))+'</h3><div class="sub">'+esc(fmtDate(m.date))+' · Wer war Spieler des Spiels?</div></div><span class="pill open">Läuft</span></header><div class="pick-grid'+enter+(sel?' has-sel':'')+'">';
  m.roster.slice().sort(rosterSort).forEach(function(p,i){
    var cls='pl'+((lastPick&&lastPick.md===m.id&&lastPick.p===p.id)?' pop':'')+(mine===p.id?' mine':'');
    var tag=(p.nr!==''&&p.nr!=null)?'<span class="nr tag">'+esc(p.nr)+'</span>':'';
    h+='<button class="'+cls+'" style="--i:'+i+'" data-act="pick" data-md="'+m.id+'" data-p="'+p.id+'" aria-pressed="'+(sel===p.id)+'"'+(canVote()?'':' disabled')+'>'+avatar(p,84)+tag+'<span class="chk" aria-hidden="true">✓</span><span class="pn">'+esc(p.name)+'</span></button>';
  });
  h+='</div>';
  var sp=sel?m.roster.filter(function(x){return x.id===sel})[0]:null;
  var label=!mine?'Stimme abgeben':(changed?'Stimme ändern':'Stimme abgegeben ✓');
  if(sp){
    h+='<div class="ballot'+(lastPick&&lastPick.md===m.id?' fresh':'')+'"><div class="bl">'+avatar(sp,72,'bav')+'<div><small>'+(changed||!mine?'Deine Wahl':'Deine Stimme')+'</small><strong>'+esc(sp.name)+'</strong>'+((sp.nr!==''&&sp.nr!=null)?'<small>Nr. '+esc(sp.nr)+'</small>':'')+'</div></div><button class="btn primary" data-act="cast" data-md="'+m.id+'"'+(changed&&canVote()?'':' disabled')+'>'+label+'</button></div>';
  }else{
    h+='<div class="ballot none"><span>Tippe auf den Spieler, den du zum Spieler des Spiels wählst.</span></div>';
  }
  h+='</section>';
  return h;
}
function voteView(){
  var open=sortedMd(cfg.matchdays.filter(function(m){return m.status==='open'}));
  var closed=sortedMd(cfg.matchdays.filter(function(m){return m.status==='closed'}));
  var h='';
  if(cfg.settings.paused)h+='<div class="notice">Die Abstimmung ist gerade pausiert. Sie geht weiter, sobald ein Admin sie freigibt.</div>';
  else if(!uid)h+='<div class="notice">Zum Abstimmen musst du bei Claude angemeldet sein. Bitte melde dich an und öffne den Link erneut.</div>';
  else if(isBlocked(uid))h+='<div class="notice">Du hast für diese Abstimmung kein Stimmrecht. Wende dich bei Fragen an den Superadmin.</div>';
  else if(canWrite===false)h+='<div class="notice">Mit deinem Zugang kannst du die Abstimmung ansehen, aber keine Stimme abgeben. Bitte einen Admin, dir Zugriff als Mitwirkender zu geben.</div>';
  if(!open.length)h+='<div class="empty"><h3>Gerade läuft keine Abstimmung</h3><p class="muted">Sobald ein Spieltag freigegeben ist, erscheint er hier.</p></div>';
  open.forEach(function(m){h+=voteCard(m)});
  if(closed.length&&(canAdmin()||!cfg.settings.hideResults)){h+='<h2>Ergebnisse</h2>';closed.slice(0,8).forEach(function(m){h+=resultCard(m)});h+=seasonHTML()}
  return h;
}

}

  if(mgmt&&isSuper)return h+clubsMgmtView();
  if(!curClub){
    if(!reg.clubs.length)return h+(isSuper?'<div class="empty"><h3>Noch kein Verein</h3><p class="muted">Lege deinen ersten Verein an.</p><button class="btn primary" data-act="mgmt">Vereine verwalten</button></div>':'<div class="empty"><h3>Noch kein Verein eingerichtet</h3><p class="muted">Bitte den Link oder QR-Code deines Vereins verwenden.</p></div>');
    return h+'<h2>Verein wählen</h2><div class="clubpick">'+reg.clubs.map(function(c){return '<button class="btn" data-act="openClub" data-id="'+c.id+'">'+esc(c.name)+'</button>'}).join('')+'</div>';
  }
  if(!loaded)return h+'<p class="muted">Lade Verein…'+(slow?' Die Verbindung ist langsam, bitte einen Moment Geduld.':'')+'</p>';
  var adm=canAdmin(),v=adm?(view||'spieltage'):(['vote','statistik','qr'].indexOf(view)>-1?view:'vote');
  if(adm){
    var names={spieltage:'Spieltage',mannschaft:'Mannschaft',statistik:'Statistik',qr:'QR-Code',einstellungen:'Einstellungen',vote:'Abstimmung'};
    h+='<nav class="tabs" aria-label="Bereiche">'+VIEWS.map(function(x){return '<button class="tab" data-act="tab" data-v="'+x+'" aria-current="'+(x===v)+'">'+names[x]+'</button>'}).join('')+'</nav>';
  }else{
    var vn={vote:'Abstimmung',statistik:'Statistik',qr:'QR-Code'};
    h+='<nav class="tabs" aria-label="Bereiche">'+['vote','statistik','qr'].map(function(x){return '<button class="tab" data-act="tab" data-v="'+x+'" aria-current="'+(x===v)+'">'+vn[x]+'</button>'}).join('')+'</nav>';
  }
  if(v==='vote')h+=voteView();else if(v==='spieltage')h+=mdView();else if(v==='mannschaft')h+=teamView();else if(v==='statistik')h+=statsView();else if(v==='qr')h+=qrView();else if(v==='einstellungen')h+=settingsView();
  return h;
}
function render(){
  var a=document.activeElement,id=a&&a.id,ss=null,se=null;
  try{ss=a.selectionStart;se=a.selectionEnd}catch(e){}
  app.innerHTML=build();
  toMark.forEach(function(k){seen[k]=1});toMark=[];lastPick=null;
  if(wantConfetti){wantConfetti=false;if(!burstDone){burstDone=true;setTimeout(burst,350)}}
  if(!mgmt&&curClub&&view==='qr')drawQR();
  var forced=!!forceFocus,fid=forceFocus||id;forceFocus='';
  if(fid){var el=document.getElementById(fid);if(el){el.focus();if(!forced&&ss!=null){try{el.setSelectionRange(ss,se)}catch(e){}}}}
}

/* ---------- Aktionen ---------- */
function arm(key,fn){
  if(armed===key){armed='';fn();return}
  armed=key;render();
  setTimeout(function(){if(armed===key){armed='';render()}},4000);
}
function getMd(id){return cfg.matchdays.filter(function(m){return m.id===id})[0]}
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-act]');if(!t)return;var d=t.dataset,a=d.act;
  if(a==='tab'){view=d.v;armed='';render()}
  else if(a==='selTeam'){selTeam=d.id;render()}
  else if(a==='pick'){pending[d.md]=d.p;lastPick={md:d.md,p:d.p};render()}
  else if(a==='cast'){castVote(d.md)}
  else if(a==='closeMd'){var m=getMd(d.md);if(m){var c=liveTally(m);m.status='closed';m.result={counts:c,total:total(c),closedAt:Date.now()};save()}}
  else if(a==='openMd'){var m2=getMd(d.md);if(m2){m2.status='open';delete m2.result;save()}}
  else if(a==='delMd'){arm('md'+d.md,function(){resetVotes(d.md).catch(function(){});cfg.matchdays=cfg.matchdays.filter(function(m){return m.id!==d.md});save();toast('Spieltag und Stimmen gelöscht')})}
  else if(a==='delPlayer'){arm('pl'+d.id,function(){var tm=cfg.teams.filter(function(x){return x.id===selTeam})[0];if(tm){tm.players=tm.players.filter(function(p){return p.id!==d.id});if(photos[d.id]&&dbc)dbc.doc('photos/'+d.id).delete().catch(function(){});save()}})}
  else if(a==='delTeam'){arm('tm'+d.id,function(){cfg.teams=cfg.teams.filter(function(x){return x.id!==d.id});selTeam='';save()})}
  else if(a==='copy'){copyLink()}
  else if(a==='resetMd'){arm('rs'+d.md,function(){var m=getMd(d.md);resetVotes(d.md).then(function(){if(m){m.status='open';delete m.result;save()}toast('Stimmen gelöscht, die Wahl ist wieder offen')}).catch(function(){toast('Stimmen konnten nicht gelöscht werden')})})}
  else if(a==='mgmt'){mgmt=!mgmt;armed='';render()}
  else if(a==='openClub'){mgmt=false;armed='';selectClub(d.id)}
  else if(a==='openClubQr'){mgmt=false;selectClub(d.id);view='qr';render()}
  else if(a==='delClub'){arm('cl'+d.id,function(){deleteClub(d.id)})}
  else if(a==='stab'){stab=d.v;armed='';render()}
  else if(a==='delMember'){arm('mb'+d.id,function(){var u=d.id,c=Object.assign({},(flags[u]&&flags[u].c)||{});delete c[curClub];Promise.all([removePicks(u,clubMdIds()),Object.keys(c).length?dbc.doc('flags/'+u).set({c:c}):dbc.doc('flags/'+u).delete()]).then(function(){toast('Mitglied und Stimmen gelöscht')}).catch(function(){toast('Mitglied konnte nicht entfernt werden')})})}
  else if(a==='rmCrest'){cfg.club.crest='';save()}
  else if(a==='rmPhoto'){if(dbc)dbc.doc('photos/'+d.id).delete().then(function(){toast('Foto entfernt')}).catch(function(){toast('Foto konnte nicht entfernt werden')})}
  else if(a==='preset'){var pr=PRESETS[+d.i];if(pr){cfg.theme={accent:pr.a,gold:pr.g,bg:'',surface:'',fg:''};applyTheme();save()}}
  else if(a==='resetTheme'){cfg.theme={accent:'',gold:'',bg:'',surface:'',fg:''};applyTheme();save()}
});
document.addEventListener('submit',function(e){
  var f=e.target.dataset&&e.target.dataset.form;if(!f)return;e.preventDefault();
  if(f==='addClub'){
    var cn=(tf.club||'').trim();if(!cn)return;
    var cid=rid();reg.clubs.push({id:cid,name:cn});tf.club='';
    dbc.doc('config/'+cid).set(normalize({club:{name:cn,crest:''}})).catch(function(){toast('Verein konnte nicht angelegt werden')});
    forceFocus='nc-name';regSave();toast('Verein angelegt');
  }else if(f==='addTeam'){
    var n=tf.name.trim();if(!n)return;var t={id:rid(),name:n,players:[]};cfg.teams.push(t);selTeam=t.id;tf.name='';forceFocus='p-name';view='mannschaft';save();
  }else if(f==='addPlayer'){
    var tm=cfg.teams.filter(function(x){return x.id===selTeam})[0],nm=pf.name.trim();if(!tm||!nm)return;
    tm.players.push({id:rid(),name:nm,nr:pf.nr.trim()});pf={name:'',nr:''};forceFocus='p-name';save();
  }else if(f==='bulk'){
    var tb=cfg.teams.filter(function(x){return x.id===selTeam})[0];if(!tb)return;
    var have={};tb.players.forEach(function(p){have[p.name.toLowerCase()]=1});
    var added=0,skipped=0;
    bulk.split(/\r?\n/).forEach(function(line){
      var r=parseLine(line);if(!r)return;
      var k=r.name.toLowerCase();
      if(have[k]){skipped++;return}
      have[k]=1;tb.players.push({id:rid(),name:r.name,nr:r.nr});added++;
    });
    if(!added&&!skipped){toast('In der Liste wurde kein Spielername gefunden');return}
    bulk='';save();toast(added+' Spieler hinzugefügt'+(skipped?', '+skipped+' schon vorhanden':''));
  }else if(f==='addMd'){
    var t2=cfg.teams.filter(function(x){return x.id===form.team})[0];if(!t2)return;
    var roster=t2.players.filter(function(p){return !form.off[p.id]}).map(function(p){return {id:p.id,name:p.name,nr:p.nr}});
    if(roster.length<2){toast('Mindestens zwei Spieler müssen zur Wahl stehen');return}
    cfg.matchdays.push({id:rid(),teamId:t2.id,teamName:t2.name,opponent:form.opp.trim(),date:form.date||today(),status:'open',roster:roster,created:Date.now()});
    form.opp='';form.off={};save();toast('Spieltag angelegt, die Abstimmung läuft');
  }
});
function onField(e){
  var t=e.target,f=t.dataset&&t.dataset.f;if(!f)return;
  if(f==='team'){if(form.team!==t.value){form.team=t.value;form.off={};render()}}
  else if(f==='opp')form.opp=t.value;
  else if(f==='date')form.date=t.value;
  else if(f.indexOf('r:')===0){var id=f.slice(2);if(t.checked)delete form.off[id];else form.off[id]=true;if(e.type==='change')render()}
  else if(f.indexOf('set:')===0){if(e.type==='change'){cfg.settings[f.slice(4)]=t.checked;save()}}
  else if(f.indexOf('photo:')===0){if(e.type==='change'){var pf0=t.files&&t.files[0];savePhoto(f.slice(6),pf0);try{t.value=''}catch(x){}}}
  else if(f.indexOf('th:')===0){var tk=f.slice(3);if(THEME_KEYS.indexOf(tk)<0||!HEXRE.test(t.value))return;cfg.theme[tk]=t.value;applyTheme();if(e.type==='change')save()}
  else if(f==='ncname')tf.club=t.value;
  else if(f==='clubsel'){if(e.type==='change'){mgmt=false;selectClub(t.value)}}
  else if(f.indexOf('clubname:')===0){if(e.type==='change'){var cid2=f.slice(9),cc=clubById(cid2),nn=t.value.trim();if(cc&&nn){cc.name=nn;dbc.doc('config/'+cid2).get().then(function(sn){if(sn.exists){var cur=sn.data();cur.club=Object.assign({},cur.club||{},{name:nn});return dbc.doc('config/'+cid2).set(cur)}}).catch(function(){});regSave()}}}
  else if(f.indexOf('acc:')===0){if(e.type==='change'){var pr=f.split(':'),au=pr[1],ac=pr[2],ar=(reg.access[au]||[]).slice();var ix=ar.indexOf(ac);if(t.checked&&ix<0)ar.push(ac);if(!t.checked&&ix>-1)ar.splice(ix,1);if(ar.length)reg.access[au]=ar;else delete reg.access[au];regSave()}}
  else if(f.indexOf('mlabel:')===0){if(e.type==='change')setFlag(f.slice(7),{label:t.value.trim()})}
  else if(f.indexOf('mrole:')===0){if(e.type==='change')setFlag(f.slice(6),{role:t.value})}
  else if(f.indexOf('mvote:')===0){if(e.type==='change')setFlag(f.slice(6),{blocked:!t.checked})}
  else if(f==='cname'){cfg.club.name=t.value;if(e.type==='change')save()}
  else if(f==='crest'){if(e.type==='change')loadCrest(t.files&&t.files[0])}
  else if(f==='tname')tf.name=t.value;
  else if(f==='pname')pf.name=t.value;
  else if(f==='pbulk')bulk=t.value;
  else if(f==='pnr')pf.nr=t.value;
  else if(f==='qrurl'){qrBase=t.value;drawQR();var c=document.getElementById('qr-full');if(c)c.textContent=qrTarget()}
}
document.addEventListener('input',onField);
document.addEventListener('change',onField);
window.addEventListener('hashchange',function(){var hc=hashClub();if(hc&&clubById(hc)&&hc!==curClub){mgmt=false;selectClub(hc)}});

function savePhoto(pid,file){
  if(!file||!dbc)return;
  if(file.size>8*1024*1024){toast('Die Datei ist größer als 8 MB');return}
  var fr=new FileReader();
  fr.onerror=function(){toast('Datei konnte nicht gelesen werden')};
  fr.onload=function(){
    var img=new Image();
    img.onerror=function(){toast('Dieses Bildformat wird nicht unterstützt')};
    img.onload=function(){
      var S=160,cv=document.createElement('canvas');cv.width=S;cv.height=S;
      var ctx=cv.getContext('2d');ctx.fillStyle='#ffffff';ctx.fillRect(0,0,S,S);
      var r=Math.max(S/img.width,S/img.height),w=img.width*r,h=img.height*r;
      ctx.drawImage(img,(S-w)/2,(S-h)*0.25,w,h);
      var data=cv.toDataURL('image/jpeg',0.82);
      dbc.doc('photos/'+pid).set({data:data}).then(function(){toast('Foto gespeichert')}).catch(function(){toast('Foto konnte nicht gespeichert werden')});
    };
    img.src=fr.result;
  };
  fr.readAsDataURL(file);
}
function loadCrest(file){
  if(!file)return;
  if(file.size>5*1024*1024){toast('Die Datei ist größer als 5 MB');return}
  var fr=new FileReader();
  fr.onerror=function(){toast('Datei konnte nicht gelesen werden')};
  fr.onload=function(){
    var img=new Image();
    img.onerror=function(){toast('Dieses Bildformat wird nicht unterstützt')};
    img.onload=function(){
      var S=200,cv=document.createElement('canvas');cv.width=S;cv.height=S;
      var ctx=cv.getContext('2d'),r=Math.min(S/img.width,S/img.height),w=img.width*r,h=img.height*r;
      ctx.drawImage(img,(S-w)/2,(S-h)/2,w,h);
      var data=cv.toDataURL('image/png');
      if(data.length>180000)data=cv.toDataURL('image/webp',0.85);
      cfg.club.crest=data;save();toast('Wappen gespeichert');
    };
    img.src=fr.result;
  };
  fr.readAsDataURL(file);
}
function parseLine(line){
  line=line.replace(/[\t;]+/g,' ').trim();if(!line)return null;
  var nr='',name=line,m;
  if((m=line.match(/^#?(\d{1,2})[\s.,:)\-–]+(.+)$/))){nr=m[1];name=m[2]}
  else if((m=line.match(/^(.+?)[\s,\-–]+#?(\d{1,2})$/))){name=m[1];nr=m[2]}
  name=name.replace(/\s+/g,' ').replace(/[,;]+$/,'').trim();
  if(!/[A-Za-zÄÖÜäöüß]/.test(name))return null;
  return {name:name,nr:nr};
}
function copyLink(){
  var url=qrTarget();
  var fallback=function(){var el=document.getElementById('qr-full');if(el){var r=document.createRange();r.selectNodeContents(el);var s=getSelection();s.removeAllRanges();s.addRange(r)}toast('Link markiert, bitte kopieren')};
  try{navigator.clipboard.writeText(url).then(function(){toast('Link kopiert')},fallback)}catch(err){fallback()}
}
function resetVotes(mdId){
  var ids=Object.keys(votes).filter(function(u){return votes[u]&&votes[u].picks&&votes[u].picks[mdId]!==undefined});
  return Promise.all(ids.map(function(u){var picks=Object.assign({},votes[u].picks);delete picks[mdId];return dbc.doc('votes/'+u).set({picks:picks})}));
}
function castVote(mdId){
  if(!canVote()){toast(cfg.settings.paused?'Die Abstimmung ist pausiert':'Du kannst gerade nicht abstimmen');return}
  var pid=pending[mdId];var m=getMd(mdId);if(!pid||!m||m.status!=='open')return;
  var ref=dbc.doc('votes/'+uid);
  ref.get().then(function(s){
    var picks=Object.assign({},(s.exists&&s.data().picks)||{});picks[mdId]=pid;
    return ref.set({picks:picks});
  }).then(function(){delete pending[mdId];toast('Danke, deine Stimme zählt!');burst();try{navigator.vibrate&&navigator.vibrate(40)}catch(x){}})
   .catch(function(e){toast(e&&e.code==='invalid_argument'?'Keine Berechtigung zum Abstimmen. Der Link braucht die Berechtigung „Mitwirkender“.':'Stimme konnte nicht gespeichert werden')});
}

/* ---------- Start ---------- */
(function(){
  render();
  if(!window.claude||!window.claude.use){dbOk=false;render();return}
  var timer=setTimeout(function(){if(!regLoaded){slow=true;render()}},10000);
  Promise.all([window.claude.use('user'),window.claude.use('db')]).then(function(r){
    var user=r[0];dbc=r[1];userNs=user;
    if(!dbc){dbOk=false;clearTimeout(timer);render();return}
    return Promise.all([user?user.id():null,user?user.canEdit():false,user?user.can('data.write'):null,user?user.isOwner():false]).then(function(x){
      uid=x[0];isAdmin=!!x[1];canWrite=x[2];isSuper=!!x[3];
      regRef=dbc.doc('registry/main');
      regRef.onSnapshot(function(sn){
        regLoaded=true;clearTimeout(timer);
        var d=sn.exists?sn.data():{};
        reg={clubs:Array.isArray(d.clubs)?d.clubs.filter(function(c){return c&&c.id}):[],access:(d.access&&typeof d.access==='object')?d.access:{}};
        if(isSuper&&!sn.exists&&!migrating){migrating=true;dbc.doc('config/main').get().then(function(cs){if(cs.exists){var cd=cs.data(),nm=(cd.club&&cd.club.name)||'Mein Verein';return regRef.set({clubs:[{id:'main',name:nm}],access:{}})}}).catch(function(){})}
        if(uid&&isAdmin&&!isSuper&&!seenWritten){seenWritten=true;dbc.doc('seen/'+uid).set({t:Date.now()}).catch(function(){})}
        pickInitial();resolveNames();render();
      },function(err){loadErr=err&&err.code||'Fehler';render()});
      dbc.collection('photos').onSnapshot(function(q){photos={};q.docs.forEach(function(d){var y=d.data();if(y&&typeof y.data==='string'&&y.data.indexOf('data:image/')===0)photos[d.id]=y.data});render()},function(){});
      dbc.collection('flags').onSnapshot(function(q){flags={};q.docs.forEach(function(d){flags[d.id]=d.data()});resolveNames();render()},function(){});
      dbc.collection('votes').onSnapshot(function(q){votes={};q.docs.forEach(function(d){votes[d.id]=d.data()});resolveNames();render()},function(){});
      if(isSuper)dbc.collection('seen').onSnapshot(function(q){seenDocs={};q.docs.forEach(function(d){seenDocs[d.id]=d.data()});resolveNames();render()},function(){});
    });
  }).catch(function(){dbOk=false;render()});
})();
})();
</script>
